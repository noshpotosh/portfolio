<section class="featuredProject stack" aria-labelledby="home-work-heading">
    <h2 id="home-work-heading" class="section-heading">Featured project</h2>

    <cf-data source="loadFeaturedProjects" name="featured">
        <template>
            <div id="featured-projects">
                <cf-loop items="featured" as="repo">
                    <template>
                        <article
                            class="projectCard projectCard--featured"
                            cf-data-repository="repo.name"
                        >
                            <div class="projectCard__layout stack">
                                <cf-include
                                    src="./components/project-title.html"
                                ></cf-include>
                                <cf-include
                                    src="./components/project-media.html"
                                ></cf-include>
                                <div class="projectCard__copy stack">
                                    <cf-include
                                        src="./components/project-details.html"
                                    ></cf-include>
                                </div>
                            </div>
                        </article>
                    </template>

                    <template data-state="empty">
                        <p id="featured-status" role="status">
                            No featured project has been selected yet.
                        </p>
                    </template>
                </cf-loop>
            </div>
        </template>

        <template data-state="loading">
            <p role="status">Loading featured project…</p>
        </template>

        <template data-state="error">
            <p id="featured-status" role="alert">
                Featured project could not load. Refresh to try again, or view
                my work on GitHub.
            </p>
        </template>
    </cf-data>
</section>

<style>
    .featuredProject {
        --stack-space: var(--space-sm);
        min-width: 0;
    }

    .featuredProject > .section-heading {
        /* Match the header actions' center without reserving space below the label. */
        padding-top: calc(
            (
                    var(--text-display) * 1.05 + var(--space-xs) +
                        var(--text-body) * 1.5 - var(--text-small) * 1.4
                ) /
                2
        );
    }

    .projectCard--featured .projectCard__layout {
        --stack-space: var(--space-sm);
        --card-copy-space: var(--space-sm);
    }

    .projectCard--featured .projectCard__actions {
        margin-top: var(--space-sm);
    }
</style>
