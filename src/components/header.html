<header class="profileHeader cluster">
    <cf-data
        class="profileHeader__identity flow"
        source="loadResume"
        name="resume"
    >
        <template>
            <h1 class="profileHeader__name" cf-text="resume.name"></h1>
            <p class="profileHeader__subtitle">
                <span cf-text="resume.title"></span>
                <span
                    class="profileHeader__location"
                    cf-text="resume.location"
                ></span>
            </p>
        </template>

        <template data-state="error">
            <p class="profileHeader__subtitle" role="alert">
                Profile could not load. Refresh to try again.
            </p>
        </template>
    </cf-data>

    <div
        class="profileHeader__actions cluster"
        role="group"
        aria-label="Page actions"
    >
        <slot name="actions">
            <button class="action resume-download" type="button" disabled>
                Download PDF
            </button>
        </slot>
    </div>
</header>

<style>
    .profileHeader {
        --cluster-space: var(--space-md);
        justify-content: space-between;
    }

    .profileHeader__identity {
        --flow-space: var(--space-xs);
        display: block;
        min-width: 0;
    }

    .profileHeader__name {
        font: 800 var(--text-display) / 1.05 var(--font-content);
        letter-spacing: -0.045em;
    }

    .profileHeader__subtitle {
        color: var(--content-muted);
        font-weight: 500;
    }

    .profileHeader__location::before {
        content: " · ";
    }

    .profileHeader__actions {
        --cluster-space: var(--space-sm);
        display: none;
    }

    :is(.resumePage, .projects-screen) .profileHeader__actions {
        display: flex;
    }
</style>
